# kitty.conf — streamlined, Ember look
include colors.conf

font_family      JetBrainsMono Nerd Font Mono
font_size        11.0
window_padding_width 10
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no

# --- tabs: hidden until you need a second one ---
tab_bar_min_tabs     2
tab_bar_edge         bottom
tab_bar_style        separator
tab_separator        " │ "
tab_title_template   " {index}:{title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# --- layouts: tall for work, splits for ad-hoc panes, stack to zoom one ---
enabled_layouts tall,splits,stack
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+z     toggle_layout stack

# --- tab keys (new tabs open in the current directory) ---
map ctrl+shift+t     new_tab
map ctrl+shift+q     close_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map ctrl+shift+alt+t set_tab_title
